<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      window.addEventListener('error', function(event) {
        var error = event.error || event;
        var div = document.createElement('div');
        div.id = "crash-reporter";
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.backgroundColor = '#7f1d1d';
        div.style.color = '#fee2e2';
        div.style.padding = '30px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '16px';
        div.style.overflow = 'auto';
        div.innerHTML = '<h1>🚨 Runtime JavaScript Error</h1>' +
                        '<p style="font-size: 18px; font-weight: bold; margin: 15px 0;">' + error.message + '</p>' +
                        '<pre style="background: #450a0a; padding: 15px; border-radius: 6px; border: 1px solid #f87171;">' + (error.stack || error) + '</pre>';
        document.body.appendChild(div);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
